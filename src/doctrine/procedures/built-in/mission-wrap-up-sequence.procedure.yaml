schema_version: "1.0"
id: mission-wrap-up-sequence
name: Mission Wrap-Up Sequence
purpose: >
  Drive a mission from "all work packages approved" to "a clean, full pull
  request with automated evidence handed to the operator" through one standing,
  repeatable close-out sequence. The sequence makes the last mile deterministic:
  it verifies readiness, resolves every tracked-issue verdict, lands the lanes
  locally, compacts the branch into readable history, establishes aggregate
  automated proof on the combined tree, and opens a full PR, so no mission ends in
  an ad-hoc, insufficiently validated, or messy state. It complements (does not replace) the per-work-package
  implement/review loop.
entry_condition: >
  Every work package in the mission is approved (the per-WP implement/review loop
  is complete). Acceptance has not yet been recorded and the mission branch has
  not yet been merged locally.
exit_condition: >
  Acceptance is recorded; every tracker issue referenced by the spec carries a
  terminal issue-matrix verdict; the lanes are merged into the mission branch and
  its history is compacted into a small set of readable, logically-sliced commits
  rebased onto the current upstream base; that merged, compacted, rebased aggregate
  has passed the relevant automated tests, type/lint checks, and applicable
  regression or architectural gates; and a full pull request is open with required
  remote checks complete before handoff. The operator, not the agent, performs the
  merge to the protected mainline.
steps:
  - title: Confirm readiness for close-out
    description: >
      Verify all work packages are in the approved lane and that the mission has
      the artifacts needed for final acceptance (for example an acceptance
      matrix). A workflow-changing mission also records its documented hosted-run
      deferral in `workflow-evidence.md`. Final acceptance runs on the
      consolidated, rebased branch before the PR; it is a pre-merge check, not a
      substitute for per-WP review or the merge gate.
    actor: agent
  - title: Retire or split the mission's development-assist tests
    description: >
      Judge the tests the mission wrote to facilitate its own slices (characterization
      oracles, parity/timing gates, per-WP shape/delegate/__module__ checks) before
      they land as permanent suite bloat, following the development-assist-test-cleanup
      procedure: identify what the mission added to assist itself, assign each a
      keep / retire / split verdict applying DIRECTIVE_041's keep-vs-delete axis, execute
      (delete-the-assertion, split mixed mega-files by kind, strip WP##/NFR-### labels
      off promoted tests, re-point named docstrings), and file the suite-wide audit for
      the copy-pasted residue rather than sweeping it into the landing PR. This governs
      only debt the mission itself created; pre-existing debt in touched areas is
      DIRECTIVE_025.
    actor: agent
  - title: Resolve every tracked-issue verdict to terminal
    description: >
      For each issue referenced in the spec, set a terminal issue-matrix verdict
      (fixed, verified-already-fixed, or deferred-with-followup). An in-mission
      placeholder must be driven to a terminal state before the mission can reach
      done. Record the evidence for each verdict.
    actor: agent
  - title: Merge the lanes locally
    description: >
      Merge the approved lanes into the mission branch with the host merge command
      (`spec-kitty merge --mission <slug>`), which lands locally only. Resolve any
      stale-lane conflicts on shared files. This is the first checkout in which the
      work packages coexist, so the aggregate gates below cannot run before it. Do
      not push to the protected mainline and never merge it yourself; the operator
      does that.
    actor: agent
  - title: Compact the branch into readable history
    description: >
      Rewrite the mission branch into a small set of readable, logically-sliced
      commits (for example docs / surface / repoints), following the
      clean-linear-commit-history tactic (a non-reordering, behaviour-preserving
      snapshot chain), never an interactive reorder. Verify the compacted tree is
      identical to the pre-compaction tree except for intentionally-dropped ignored
      artefacts.
    actor: agent
  - title: Rebase onto the current upstream base
    description: >
      Fetch the true upstream mainline and rebase the compacted commits onto it so
      the branch is ahead-only (rebase over merge, for linear history). This yields
      the final combined tree the aggregate gates run against in the next step.
    actor: agent
    on_failure: >
      If the rebase conflicts with new upstream work, resolve slice-by-slice; if the
      base has diverged unexpectedly, fetch and reconcile before proceeding rather
      than forcing over unseen commits.
  - title: Establish automated proof on the consolidated, rebased aggregate before landing
    description: >
      The WPs only coexist once the lanes are merged, so run the aggregate gates on
      the merged, compacted, rebased tree rather than on any single lane. Run the
      relevant targeted tests, type/lint checks, and applicable regression or
      architectural gates against the combined diff, and add focused regression
      coverage for new behaviour. An adversarial review squad may be used when it
      adds verification signal, but it is optional and does not replace executable
      proof. Resolve actual failures before landing, then force-push the validated
      branch with lease.
    actor: agent
  - title: Record final acceptance before opening the full pull request
    description: >
      Run `spec-kitty accept --mission <slug>` against the consolidated, rebased
      branch and resolve every blocker it reports. For a workflow-changing mission,
      the documented hosted-run deferral satisfies this pre-PR gate; the successful
      GitHub Actions run is captured on the full PR in the next step. This keeps the
      PR merge-ready without requiring a premature per-work-package PR.
    actor: agent
  - title: Open a full pull request and complete remote automation
    description: >
      Open a full PR against the upstream mainline only after the coherent,
      complete slice has passed its local automated proof. Draft pull requests are
      prohibited, and a PR must never be opened merely to solicit interim human feedback. The body states
      the change, exact automated-validation evidence, and any remaining merge
      blocker. Complete required remote checks and address actionable automated
      findings before handoff. For a workflow-changing mission, capture the
      successful GitHub Actions run ID or URL in `workflow-evidence.md`.
    actor: agent
  - title: Verify hosted workflow evidence before handoff
    description: >
      For a workflow-changing mission, rerun `spec-kitty accept --mission <slug>
      --require-hosted-workflow-evidence --no-commit` after the full PR's remote
      workflow completes. This final check rejects the pre-PR deferral marker
      until it is replaced by a successful GitHub Actions run ID or URL.
    actor: agent
  - title: Hand off to the operator
    description: >
      Summarise the outcome (what shipped, the automated validation evidence, which
      development-assist tests were retired / split / kept-and-renamed, open
      follow-ups) and hand the full PR to the operator to merge. Capture durable
      learnings in the mission retrospective and memory. Do not merge to the
      mainline on the agent's own initiative.
    actor: agent
anti_patterns:
  - name: Per-WP green treated as the final gate
    description: >
      Skipping the aggregate review because every work package already passed.
      The WPs only coexist after merge; the aggregate diff is where cross-WP
      integration breaks surface.
  - name: Merge commits instead of a linear history
    description: >
      Landing the mission as a tangle of merge/status commits rather than a
      compacted, rebased, linear branch. Readability and bisectability are lost.
  - name: Deferring instead of finishing
    description: >
      Punting genuinely small remaining work to a follow-up to close the mission
      faster. Only genuinely high-effort / mission-sized work is deferred; the
      rest is completed before hand-off.
  - name: Agent merges the mainline
    description: >
      Merging to the protected mainline on the agent's own initiative. The operator
      merges; the agent prepares and hands off.
  - name: Draft-pull-request or human-review handoff
    description: >
      Using a draft pull request, opening a PR merely because a change exists, or
      treating human review as correctness evidence. A full PR follows
      sufficient automated proof for the coherent slice.
  - name: Unresolved issue verdicts at close
    description: >
      Leaving in-mission or empty verdicts in the issue matrix at hand-off. Every
      referenced issue must reach a terminal verdict before done.
notes: |
  Standing close-out sequence for the SDD flow. It is the "last mile" companion to
  the per-work-package implement/review loop: the loop makes each WP correct, this
  procedure makes the mission land cleanly and reviewably.

  Sequence summary: confirm readiness -> retire/split dev-assist tests -> resolve issue
  verdicts -> local merge -> compact history -> rebase onto upstream -> aggregate automated
  proof -> acceptance -> full PR -> required remote checks -> hosted-evidence verification ->
  hand off. Aggregate proof runs on the merged, compacted, rebased tree (the first checkout
  where the WPs coexist), not on separate lanes. The operator performs the mainline merge
  (DIRECTIVE_045).

  The three quality pillars this enforces are captured as a standard in the
  readable-consistent-prs directive (DIRECTIVE_046): linear, consistent/complete,
  automatically proven.
references:
  - type: procedure
    id: adversarial-squad-deployment
    reason: >
      An adversarial review may add signal at the pre-merge point-cut, but remains
      optional and never replaces the required automated proof.
  - type: procedure
    id: post-merge-arch-gate-adjudication
    reason: >
      When the aggregate review touches architectural gates or cross-base state, the
      post-merge arch-gate adjudication procedure governs how those findings are
      weighed before hand-off.
  - type: procedure
    id: mission-tracer-files
    reason: >
      The assess step of the tracer-files procedure feeds this sequence's hand-off:
      tracer insights are summarised in the retrospective at close-out.
  - type: procedure
    id: development-assist-test-cleanup
    reason: >
      The "retire or split the mission's development-assist tests" step is an instance
      of the development-assist-test-cleanup procedure applied at the wrap-up point-cut,
      so a mission's own scaffolding tests are judged before they land as suite bloat.
  - type: tactic
    id: clean-linear-commit-history
    reason: >
      The compact-history and rebase-onto-upstream steps follow the
      clean-linear-commit-history tactic (non-reordering snapshot chain, rebase
      over merge).
  - type: directive
    id: DIRECTIVE_045
    reason: >
      Landing and hand-off obey PRs-only and read-intent: the agent prepares the PR
      and the operator merges the protected mainline.
